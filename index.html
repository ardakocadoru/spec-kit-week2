<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/quotes.js"></script>
    <script defer src="js/quote-picker.js"></script>
    <script defer src="js/favorites-store.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <main class="card">
      <h1>Quote of the Day</h1>

      <figure id="quote" aria-live="polite">
        <blockquote>
          <p id="quote-text"></p>
        </blockquote>
        <figcaption id="quote-author"></figcaption>
      </figure>

      <div class="actions">
        <button type="button" id="new-quote">New quote</button>
        <button type="button" id="favorite-toggle" aria-pressed="false">
          <span id="favorite-icon" aria-hidden="true">☆</span> Favorite
        </button>
      </div>
    </main>
  </body>
</html>
